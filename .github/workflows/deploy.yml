name: Deploy to DigitalOcean App Platform

on:
  push:
    branches: [version-2.0]
    paths-ignore:
      - 'README.md'
      - 'DEPLOY.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch: # allow manual trigger from GitHub UI

concurrency:
  group: do-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync app spec & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Find or create the app
        id: app
        run: |
          set -euo pipefail
          APP_NAME="quran-data"
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | awk -v name="$APP_NAME" '$2==name {print $1}' | head -1)

          if [ -z "${APP_ID}" ]; then
            echo "::notice::App '$APP_NAME' not found — creating from spec"
            APP_ID=$(doctl apps create --spec .do/app.yaml --format ID --no-header --wait)
            echo "Created app: $APP_ID"
          else
            echo "::notice::App '$APP_NAME' exists ($APP_ID) — updating spec"
            doctl apps update "$APP_ID" --spec .do/app.yaml --wait
          fi

          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"

      - name: Trigger fresh deployment
        run: |
          set -euo pipefail
          doctl apps create-deployment "${{ steps.app.outputs.app_id }}" --wait

      - name: Print live URL
        run: |
          set -euo pipefail
          URL=$(doctl apps get "${{ steps.app.outputs.app_id }}" --format DefaultIngress --no-header)
          echo "::notice::Live URL: $URL"
          echo "## 🚀 Deployment successful" >> "$GITHUB_STEP_SUMMARY"
          echo "**Live URL**: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "**App ID**: ${{ steps.app.outputs.app_id }}" >> "$GITHUB_STEP_SUMMARY"
