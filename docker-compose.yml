services:
  api:
    build: .
    image: quran-data-api:local
    container_name: quran_data_api
    environment:
      - PORT=5000
      - API_RATE_LIMIT=300
      - NODE_ENV=production
    ports:
      # Host port 5106 → container 5000. 5000 is blocked by macOS AirPlay,
      # 5001 is taken by another local demo (fajer_web), so we use 5106.
      - "5106:5000"
    restart: unless-stopped
    networks:
      - quran_net

  client:
    build: ./client
    image: quran-data-client:local
    container_name: quran_data_client
    depends_on:
      - api
    ports:
      # Host port 3106 → container 80. 3000 is taken by another local demo
      # (screenshot-to-code); using 3106 to avoid every common conflict.
      - "3106:80"
    restart: unless-stopped
    networks:
      - quran_net

networks:
  quran_net:
    driver: bridge
